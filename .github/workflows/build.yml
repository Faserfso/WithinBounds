name: Сборка книги

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Собрать DOCX, EPUB и FB2
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: v-predelah-dopuska
          path: build/
