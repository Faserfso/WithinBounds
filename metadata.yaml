description: |
  Санта-Вела, Средиземноморье, 2068 год. Городом управляет Основа: она лечит, кормит, охлаждает дома и никого не выселяет силой. Фабрика "Наследник", способная строить следующие фабрики, должна дать дешёвую воду южному берегу моря. В последний день своей работы старый смотритель водного узла замечает расхождение двух датчиков, которое все считают несущественным. За одни сутки жары директор, безработный свидетель с тремя дипломами, агенты с собственной историей ошибок и люди, не желающие быть лишними, выясняют, кто решает, ради кого работает свободная мощность города.
